name: Get Hot News

on:
  workflow_dispatch:  # 保留手动触发，紧急热点随时跑
  schedule:
    # 每天 7:00 ~ 19:00，每小时自动运行1次
    - cron: '0 7-19 * * *'

jobs:
  crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行热点抓取
        run: python trendradar/main.py

      - name: 推送到微信
        run: |
          if [ -f output/news/latest.md ]; then
            curl -X POST "https://sctapi.ftqq.com/${{ secrets.SCKEY }}.send" \
              -d "title=【热点更新·整点推送】&desp=$(cat output/news/latest.md)"
          fi
