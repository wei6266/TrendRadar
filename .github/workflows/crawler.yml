name: Get Hot News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        run: python trendradar/main.py

      - name: Push to WeChat via Server酱
        run: |
          curl -X POST "https://sctapi.ftqq.com/${{ secrets.SCKEY }}.send" \
            -d "title=热点推送更新&desp=$(cat output/news/latest.md)"
